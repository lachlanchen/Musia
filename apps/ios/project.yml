name: Musia
options:
  bundleIdPrefix: art.lazying.musia
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "9"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  MusiaCore:
    type: framework
    platform: iOS
    sources: [Musia/Core]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.lazying.musia.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
  Musia:
    type: application
    platform: iOS
    sources:
      - path: Musia
        excludes: [Core, Resources/Info.plist]
      - path: WatchShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.lazying.musia
        INFOPLIST_FILE: Musia/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        PROVISIONING_PROFILE_SPECIFIER: $(MUSIA_APP_PROFILE)
    dependencies:
      - target: MusiaCore
        embed: true
      - target: MusiaWatch
        embed: true
        codeSign: false
  MusiaWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: MusiaWatch
      - path: WatchShared
      - path: WatchResources
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.lazying.musia.watchkitapp
        INFOPLIST_FILE: WatchResources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        TARGETED_DEVICE_FAMILY: "4"
        SUPPORTS_MACCATALYST: NO
        SKIP_INSTALL: YES
        PROVISIONING_PROFILE_SPECIFIER: $(MUSIA_WATCH_PROFILE)
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  MusiaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/MusiaCoreTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.lazying.musia.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Musia
      - target: MusiaCore
  MusiaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/MusiaUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.lazying.musia.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Musia
schemes:
  MusiaWatch:
    build:
      targets:
        MusiaWatch: all
  Musia:
    build:
      targets:
        Musia: all
        MusiaTests: [test]
        MusiaUITests: [test]
    test:
      targets: [MusiaTests, MusiaUITests]
      gatherCoverageData: true
