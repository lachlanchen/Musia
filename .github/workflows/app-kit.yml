name: Shared App Kit Contracts
on:
  pull_request:
    paths:
      - 'packages/lazyingart-app-kit/**'
      - 'apps/shared/lazyingart-app.json'
      - 'tools/check_lazyingart_app.mjs'
      - 'tools/tests/lazyingart_app.test.mjs'
      - 'tests/test_lazyingart_adoption.py'
      - 'tests/test_learning_api.py'
      - 'musia/learning.py'
      - 'requirements-learning.txt'
      - '.github/workflows/app-kit.yml'
  push:
    paths:
      - 'packages/lazyingart-app-kit/**'
      - 'apps/shared/lazyingart-app.json'
      - 'tools/check_lazyingart_app.mjs'
      - 'tools/tests/lazyingart_app.test.mjs'
      - 'tests/test_lazyingart_adoption.py'
      - 'tests/test_learning_api.py'
      - 'musia/learning.py'
      - 'requirements-learning.txt'
      - '.github/workflows/app-kit.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test --prefix packages/lazyingart-app-kit
      - run: node --test tools/tests/lazyingart_app.test.mjs
      - run: node tools/check_lazyingart_app.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-learning.txt
      - run: python -m unittest discover -s tests -p 'test_learning_api.py'
      - run: python -m unittest discover -s tests -p 'test_lazyingart_adoption.py'
